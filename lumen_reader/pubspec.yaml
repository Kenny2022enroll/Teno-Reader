name: lumen_reader
description: A cross-platform reading app with Apple HIG-inspired design.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Routing
  go_router: ^14.2.0
  # Local storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  # EPUB parsing (done directly via archive + xml; no epub package needed)
  archive: ^3.4.10
  xml: ^6.5.0
  # Text to speech (a11y)
  flutter_tts: ^4.2.0
  # PDF support (optional extra format)
  syncfusion_flutter_pdf: ^26.1.3
  # Encryption for local privacy
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  # Network sync (secure transport)
  dio: ^5.7.0
  # Utility
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^2.5.0
  file_picker: ^8.1.6
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/books/
    - assets/fonts/
    - assets/images/
