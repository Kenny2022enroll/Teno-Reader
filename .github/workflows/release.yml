name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable
  WORK_DIR: lumen_reader

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: lumen_reader
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-apk
            runner: ubuntu-latest
          - target: android-aab
            runner: ubuntu-latest
          - target: ios
            runner: macos-latest
          - target: macos
            runner: macos-latest
          - target: windows
            runner: windows-latest
          - target: linux
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # --------------------------------------------------------- Platform dirs
      # Platform folders (android/ios/macos/windows/linux) are intentionally not
      # committed; regenerate them from the Flutter template before building.
      - name: Ensure platform directories
        run: |
          set -x
          flutter create --platforms android,ios,macos,windows,linux .
          # Re-run pub get so plugins are registered in the freshly created platform dirs.
          flutter pub get

      # ----------------------------------------------------------- Android SDK
      # Newer Flutter plugins (e.g. file_picker via flutter_plugin_android_lifecycle)
      # require compileSdk >= 36, but the Flutter template default is still 34.
      # Patch the regenerated android config so the build passes.
      - name: Bump Android compileSdk to 36
        if: matrix.target == 'android-apk' || matrix.target == 'android-aab'
        run: |
          set -x
          # --- 1. gradle.properties: set flutter.compileSdkVersion / targetSdkVersion ---
          if [ -f android/gradle.properties ]; then
            sed -i -E 's/^[[:space:]]*#[[:space:]]*(flutter\.compileSdkVersion=.*)$/\1/' android/gradle.properties
            sed -i -E 's/^[[:space:]]*#[[:space:]]*(flutter\.targetSdkVersion=.*)$/\1/' android/gradle.properties
            sed -i 's/^flutter\.compileSdkVersion=.*$/flutter.compileSdkVersion=36/' android/gradle.properties
            sed -i 's/^flutter\.targetSdkVersion=.*$/flutter.targetSdkVersion=36/' android/gradle.properties
            grep -q '^flutter\.compileSdkVersion=' android/gradle.properties \
              || echo 'flutter.compileSdkVersion=36' >> android/gradle.properties
            grep -q '^flutter\.targetSdkVersion=' android/gradle.properties \
              || echo 'flutter.targetSdkVersion=36' >> android/gradle.properties
            # Also set the global android.compileSdkVersion property (AGP 8.0+).
            # This applies to ALL subprojects (including plugins like file_picker),
            # preventing "file_picker is currently compiled against android-34" errors.
            grep -q '^android\.compileSdkVersion=' android/gradle.properties \
              || echo 'android.compileSdkVersion=36' >> android/gradle.properties
            grep -q '^android\.targetSdkVersion=' android/gradle.properties \
              || echo 'android.targetSdkVersion=36' >> android/gradle.properties
            echo "--- android/gradle.properties after patch ---"
            cat android/gradle.properties
          fi

          # --- 2. App module build.gradle / build.gradle.kts: set compileSdk / targetSdk ---
          # Groovy (.gradle) — older Flutter templates
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdk\s+[0-9]+/compileSdk 36/g' android/app/build.gradle
            sed -i -E 's/targetSdk(Version)?\s+[0-9]+/targetSdk\1 36/g' android/app/build.gradle
          fi
          # Kotlin DSL (.gradle.kts) — Flutter 3.22+ templates
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i -E 's/targetSdk\s*=\s*[0-9]+/targetSdk = 36/g' android/app/build.gradle.kts
          fi

          # --- 3. Root build.gradle / build.gradle.kts: add subprojects override ---
          # This forces ALL plugin subprojects (e.g. file_picker) to use compileSdk 36.
          # Gradle allows multiple subprojects blocks, so we append unconditionally.
          SUBPROJECTS_BLOCK='
          subprojects {
              afterEvaluate {
                  if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
                      project.android {
                          compileSdkVersion 36
                          defaultConfig {
                              targetSdkVersion 36
                          }
                      }
                  }
              }
          }
          '
          SUBPROJECTS_BLOCK_KTS='
          subprojects {
              afterEvaluate {
                  try {
                      project.extensions.findByType(com.android.build.api.dsl.ApplicationExtension::class.java)?.let { ext ->
                          try { ext.compileSdk = 36 } catch (_: Exception) { }
                          try { ext.defaultConfig.targetSdk = 36 } catch (_: Exception) { }
                      }
                  } catch (_: Exception) { }
                  try {
                      project.extensions.findByType(com.android.build.api.dsl.LibraryExtension::class.java)?.let { ext ->
                          try { ext.compileSdk = 36 } catch (_: Exception) { }
                      }
                  } catch (_: Exception) { }
              }
          }
          '
          if [ -f android/build.gradle ]; then
            echo "$SUBPROJECTS_BLOCK" >> android/build.gradle
            echo "--- Added subprojects override to android/build.gradle ---"
          fi
          if [ -f android/build.gradle.kts ]; then
            echo "$SUBPROJECTS_BLOCK_KTS" >> android/build.gradle.kts
            echo "--- Added subprojects override to android/build.gradle.kts ---"
          fi

          # --- 4. Print the final state of key files for debugging ---
          echo "--- android/app/build.gradle (or .kts) preview ---"
          if [ -f android/app/build.gradle ]; then
            grep -n 'compileSdk\|targetSdk' android/app/build.gradle || echo "(no compileSdk/targetSdk found)"
          fi
          if [ -f android/app/build.gradle.kts ]; then
            grep -n 'compileSdk\|targetSdk' android/app/build.gradle.kts || echo "(no compileSdk/targetSdk found)"
          fi
          echo "--- Root build.gradle (or .kts) subprojects check ---"
          if [ -f android/build.gradle ]; then
            grep -n 'subprojects\|compileSdk' android/build.gradle || echo "(no subprojects/compileSdk found)"
          fi
          if [ -f android/build.gradle.kts ]; then
            grep -n 'subprojects\|compileSdk' android/build.gradle.kts || echo "(no subprojects/compileSdk found)"
          fi

      # ------------------------------------------------------------------ Linux
      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev \
            libstdc++-12-dev clang cmake pkg-config

      # ---------------------------------------------------------------- Android
      # Release APK/AAB need a signing config. Sign with the debug keystore so
      # CI builds succeed without secrets (Play Console re-signs on upload).
      - name: Configure Android debug signing
        if: matrix.target == 'android-apk' || matrix.target == 'android-aab'
        shell: bash
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          printf '%s\n' \
            'storePassword=android' \
            'keyPassword=android' \
            'keyAlias=androiddebugkey' \
            "storeFile=${HOME}/.android/debug.keystore" \
            > android/key.properties

      - name: Build Android APK
        if: matrix.target == 'android-apk'
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        if: matrix.target == 'android-aab'
        run: flutter build appbundle --release

      # ------------------------------------------------------------------- iOS
      # Build an unsigned release bundle for real devices (simulator builds are
      # debug-only and unsuitable for release artifacts).
      - name: Build iOS (no codesign)
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Archive iOS build
        if: matrix.target == 'ios'
        run: |
          mkdir -p ../artifacts
          cd build/ios/iphoneos
          zip -rq ../../../artifacts/ios-build.zip .

      # ------------------------------------------------------------------- macOS
      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Archive macOS app
        if: matrix.target == 'macos'
        run: |
          mkdir -p ../artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/*.app \
            ../artifacts/macos-app.zip

      # ---------------------------------------------------------------- Windows
      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Archive Windows build
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) {
            $src = Get-ChildItem -Path "build\windows" -Recurse -Directory -Filter "Release" |
              Select-Object -First 1 -ExpandProperty FullName
          }
          Compress-Archive -Path "$src\*" -DestinationPath "..\artifacts\windows-build.zip"

      # ------------------------------------------------------------------ Linux
      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Archive Linux build
        if: matrix.target == 'linux'
        run: |
          mkdir -p ../artifacts
          cd build/linux/x64/release/bundle
          tar -czf ../../../../artifacts/linux-build.tar.gz .

      # ----------------------------------------------------------- Upload step
      - name: Normalize artifact name
        id: name
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            android-apk) ext="apk"; files="build/app/outputs/flutter-apk/*.apk" ;;
            android-aab) ext="aab"; files="build/app/outputs/bundle/release/app-release.aab" ;;
            ios)         ext="zip"; files="../artifacts/ios-build.zip" ;;
            macos)       ext="zip"; files="../artifacts/macos-app.zip" ;;
            windows)     ext="zip"; files="../artifacts/windows-build.zip" ;;
            linux)       ext="tar.gz"; files="../artifacts/linux-build.tar.gz" ;;
          esac
          echo "files=$files" >> $GITHUB_OUTPUT
          echo "ext=$ext" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-reader-${{ matrix.target }}
          path: ${{ steps.name.outputs.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name "*.apk" -o \
            -name "*.aab" -o \
            -name "*.zip" -o \
            -name "*.tar.gz" \
          \) -exec cp {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: true
          files: release-assets/*
